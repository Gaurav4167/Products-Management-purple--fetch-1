<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">

    <title>Posts Data Management</title>
</head>

<body>

    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center"><i class="fa-brands fa-product-hunt mr-1"></i>Products Data Management</h1>
                <h6 class="text-center">Add, Delete and Update Product Here</h6>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="card" id="reultCard">
                <div class="card-body">
                    <div class="row">
                        <div class="col-12">
                            <div class="card shadow">
                                <div class="card-body">

                                    <h4 class="text-center mb-3" id="formHeading">Add Product</h4>
                                    <div class="border-bottom "></div>
                                    <form id="productForm">
                                        <div class="row">
                                            <div class="form-group col-6">
                                                <label class="mt-4" for="pName"><b><i
                                                            class="fa-brands fa-product-hunt mr-1"></i>Product
                                                        Name</b></label>
                                                <input type="text" class="form-control" id="pName"
                                                    placeholder="Enter product name">
                                            </div>

                                            <div class="form-group col-6">
                                                <label class="mt-4" for="price"><b> <i
                                                            class="fa-solid fa-indian-rupee-sign"></i>Price</b></label>
                                                <input type="number" class="form-control" id="price"
                                                    placeholder="Product Price">
                                            </div>

                                            <div class="form-group col-6">
                                                <label class="mt-4" for="category"><b><i class="fa-solid fa-list"></i>
                                                        Category</b></label>
                                                <select class="form-control" name="" id="category" placeholder="">
                                                    <option value="">Category</option>
                                                    <option value="Electronics">Electronics</option>
                                                    <option value="Clothing">Clothing</option>
                                                    <option value="Shoes">Shoes</option>
                                                    <option value="Beuty">Beuty</option>
                                                    <option value="Books">Books</option>
                                                    <option value="Ferniture">Ferniture</option>
                                                </select>
                                            </div>

                                            <div class="form-group col-6">
                                                <label class="mt-4" for="quantity"><i class="fa-solid fa-hashtag"></i>
                                                    <b>Quantity</b></label>
                                                <input class="form-control" type="number" id="quantity"
                                                    placeholder="Quantity(How much)" min="0">
                                            </div>

                                            <button type="submit" class="btn btn-primary col-2 m-2" id="addBtn">
                                                Add product
                                            </button>
                                            <button type="button" class="btn btn-primary col-2 m-2 d-none"
                                                id="updateBtn">
                                                Update product
                                            </button>

                                            <button type="button" class="btn btn-secondary col-2 m-2" id="clearBtn">
                                                Clear
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card shadow">
                                <div class="card-body">
                                    <div class="col-12">
                                        <h3>Products List</h3>
                                    </div>
                                    <div>
                                        <table class="table">
                                            <thead class="">
                                                <tr>
                                                    <th>#</th>
                                                    <th>Product Name</th>
                                                    <th>Category</th>
                                                    <th>Price</th>
                                                    <th>Quantity</th>
                                                    <th>Action</th>
                                                </tr>
                                            </thead>
                                            <tbody id="tbody">
                                                <!-- <tr>
                                                    <td>1</td>
                                                    <td>Laptop</td>
                                                    <td>Electronics</td>
                                                    <td>65000</td>
                                                    <td>50</td>
                                                    <td><button class="btn btn-primary shadow">Edit</button><button class="btn btn-danger shadow ml-1">Remove</button></td>
                                                    
                                                </tr> -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div id="spinner" class="d-none">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
